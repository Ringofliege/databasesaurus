services:
  app:
    image: 'registry.gitlab.com/peakwork/app/misc/database-helper:latest'
    expose:
      - '3000'
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: '${DATABASE_URL}'
      BASIC_AUTH_USER: '${BASIC_AUTH_USER:-admin}'
      BASIC_AUTH_PASS: '${BASIC_AUTH_PASS:-changeme}'
      GIT_SSH_PRIVATE_KEY: '${GIT_SSH_PRIVATE_KEY:-}'
      REDIS_URL: '${REDIS_URL:-}'
    volumes:
      - 'workspaces:/data/workspaces'
    depends_on:
      - redis
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://0.0.0.0:3000/ >/dev/null 2>&1 || exit 1'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  redis:
    image: 'redis:7-alpine'
    command:
      - redis-server
      - '--appendonly'
      - 'yes'
    volumes:
      - 'redis_data:/data'
    expose:
      - '6379'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  workspaces: null
  redis_data: null
